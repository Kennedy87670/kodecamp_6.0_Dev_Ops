services:
  db:
    image: postgres:15-alpine
    container_name: dream-vacation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dream_vacation
      POSTGRES_USER: dream_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dream_user -d dream_vacation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: ${DOCKER_USERNAME}/kh-2026-backend:${IMAGE_TAG}
    container_name: dream-vacation-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dream_user:${POSTGRES_PASSWORD}@db:5432/dream_vacation
      COUNTRIES_API_BASE_URL: https://restcountries.com/v3.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: ${DOCKER_USERNAME}/kh-2026-frontend:${IMAGE_TAG}
    container_name: dream-vacation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  gateway:
    image: nginx:1.27-alpine
    container_name: dream-vacation-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
